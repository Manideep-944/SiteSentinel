services:
  - type: web
    name: sitesentinel-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONITOR_INTERVAL_MINUTES
        value: 5
      - key: REQUEST_TIMEOUT_MS
        value: 10000
    healthCheckPath: /api/health
